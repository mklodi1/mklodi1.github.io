<script>
  (function () {
    var el = document.getElementById('takeoff');
    if (!el) return;
    var seen = false;
    try { seen = sessionStorage.getItem('takeoff') === '1'; sessionStorage.setItem('takeoff', '1'); } catch (e) {}
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (seen || reduce) { el.remove(); return; }
    // roll along the gap just below the intro, then climb out to the top right
    var intro = document.querySelector('.home .intro');
    if (intro) el.style.setProperty('--ground', Math.round(intro.getBoundingClientRect().bottom + 6) + 'px');
    el.classList.add('go');
    el.querySelector('.takeoff-move').addEventListener('animationend', function () { el.remove(); });
  })();
</script>
