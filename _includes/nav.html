<a class="skip" href="#main">Skip to content</a>
<header class="nav wrap">
  <a class="nav-home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span class="nav-bars" aria-hidden="true"></span><span class="nav-toggle-label">Menu</span></button>
  <nav aria-label="Main" id="site-nav">
    <a href="{{ '/cv/' | relative_url }}"{% if page.url contains '/cv' %} aria-current="page"{% endif %}>CV</a>
    <a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects' %} aria-current="page"{% endif %}>Projects</a>
    <a href="{{ '/conferences/' | relative_url }}"{% if page.url contains '/conferences' %} aria-current="page"{% endif %}>Conferences &amp; Awards</a>
    <a href="{{ '/life-map/' | relative_url }}"{% if page.url contains '/life-map' %} aria-current="page"{% endif %}>Life Map</a>
    <a href="{{ '/personal/' | relative_url }}"{% if page.url contains '/personal' %} aria-current="page"{% endif %}>Personal</a>
    {% if site.scholar %}<a href="{{ site.scholar }}">Scholar</a>{% endif %}
    <a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing' %} aria-current="page"{% endif %}>Writing</a>
    {% if site.formspree_id %}<a href="{{ '/#message' | relative_url }}">Message</a>{% endif %}
  </nav>
</header>
<script>
  (function () {
    var b = document.querySelector('.nav-toggle'), n = document.getElementById('site-nav');
    if (!b || !n) return;
    b.addEventListener('click', function () {
      var open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
      n.classList.toggle('open', open);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && n.classList.contains('open')) { n.classList.remove('open'); b.setAttribute('aria-expanded', 'false'); b.focus(); }
    });
  })();
</script>
