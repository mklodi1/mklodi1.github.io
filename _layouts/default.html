<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
<div class="page-card">
{% include nav.html %}
<main id="main">
{{ content }}
</main>
<button type="button" class="to-top" id="to-top" aria-label="Back to top" hidden>
  <svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true"><path d="M50 4 C54.5 4 57 10 57 17 L57 38 L94 58 L94 67 L57 56 L57 77 L69 86 L69 93 L50 88.5 L31 93 L31 86 L43 77 L43 56 L6 67 L6 58 L43 38 L43 17 C43 10 45.5 4 50 4 Z"/></svg>
</button>
<script>
  // Back-to-top plane: appears after scrolling down; click to fly back up.
  (function () {
    var btn = document.getElementById('to-top');
    if (!btn) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    btn.hidden = false;
    function update() { btn.classList.toggle('show', window.scrollY > 600); }
    window.addEventListener('scroll', update, { passive: true }); update();
    btn.addEventListener('click', function () {
      if (reduce) { window.scrollTo(0, 0); return; }
      btn.classList.add('launch');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(function () { btn.classList.remove('launch'); update(); }, 900);
    });
  })();
</script>
</div>
</body>
</html>
