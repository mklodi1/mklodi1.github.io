<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
<div class="page-card">
{% include nav.html %}
<main id="main">
{{ content }}
</main>
<button type="button" class="to-top" id="to-top" aria-label="Back to top" hidden>
  <svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true"><path d="M50 3 C52.8 3 54.2 7.5 54.2 13.5 L54.2 37 L95 59.5 L95 63.2 L54.2 52.8 L54.2 79 L69 88.5 L69 92 L54 89.5 L52 97 L48 97 L46 89.5 L31 92 L31 88.5 L45.8 79 L45.8 52.8 L5 63.2 L5 59.5 L45.8 37 L45.8 13.5 C45.8 7.5 47.2 3 50 3 Z M62.6 41.6 a1.9 4.2 0 1 0 3.8 0 a1.9 4.2 0 1 0 -3.8 0 Z M77.2 49.6 a1.8 3.9 0 1 0 3.6 0 a1.8 3.9 0 1 0 -3.6 0 Z M33.6 41.6 a1.9 4.2 0 1 0 3.8 0 a1.9 4.2 0 1 0 -3.8 0 Z M19.2 49.6 a1.8 3.9 0 1 0 3.6 0 a1.8 3.9 0 1 0 -3.6 0 Z"/></svg>
</button>
<script>
  // Back-to-top plane: appears after scrolling down; click to fly back up.
  (function () {
    var btn = document.getElementById('to-top');
    if (!btn) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    btn.hidden = false;
    function update() { btn.classList.toggle('show', window.scrollY > 600); }
    window.addEventListener('scroll', update, { passive: true }); update();
    btn.addEventListener('click', function () {
      if (reduce) { window.scrollTo(0, 0); return; }
      btn.classList.add('launch');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(function () { btn.classList.remove('launch'); update(); }, 900);
    });
  })();
</script>
</div>
</body>
</html>
