---
layout: default
---
<article class="wrap post">
  <p class="back"><a href="{{ '/writing/' | relative_url }}">All writing</a></p>
  <h1>{{ page.title }}</h1>
  <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  <div class="prose">
    {{ content }}
  </div>
  <nav class="post-nav" aria-label="More posts">
    {% if page.previous %}<a href="{{ page.previous.url | relative_url }}"><small>Older</small>{{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
    {% if page.next %}<a class="next" href="{{ page.next.url | relative_url }}"><small>Newer</small>{{ page.next.title }}</a>{% endif %}
  </nav>
</article>
