- title: "Derivatives pricing and market risk engine"
  venue: "EIMplus, 2025–2026"
  summary: "An end-to-end Python tool that prices options with Black-Scholes and the Greeks, forecasts volatility with GARCH to flag underpriced contracts, and runs Monte Carlo simulations on historical returns to estimate expected PnL and tail risk (VaR, CVaR) for each trade. XGBoost and logistic regression models filter trading signals (ROC-AUC 0.73), and a Streamlit dashboard publishes the forecasts for daily trading decisions."
