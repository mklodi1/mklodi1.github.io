- title: "AI agent for scientific literature review"
  venue: "EIMplus, 2025–2026"
  summary: "A retrieval-augmented generation (RAG) system and LLM agent that reviews scientific papers automatically, using embeddings, a ChromaDB vector database and semantic search. It cut manual review time by 85%, and runs on a Docker, CI/CD and MLflow pipeline so every experiment is reproducible."
  # link: https://github.com/mklodi1/REPO-NAME

- title: "Finding disease genes in large-scale biomedical data"
  venue: "Ph.D. research, Rutgers University, 2021–2026"
  summary: "Predictive machine learning and statistical models built on more than 200 million records of structured and unstructured biomedical data, identifying 300+ high-confidence genes linked to neurological disorders. The findings went straight into the lab's decisions about which experiments to run next."
