- event: "Molecular Biosciences Graduate Student Organization Symposium 2026"
  type: "Poster Presentation"
  date: "Mar 2026"
  abstract_title: "Identifying Risk Genes Associated with Neural Progenitor Cell (NPC) Hyperproliferation"
  abstract: >-
    Neural progenitor cell (NPC) hyperproliferation has been implicated as a key mechanism underlying
    altered early brain development in several neurodevelopmental disorders. Increased NPC proliferation
    can result in greater neural cell production during early brain development, and has been linked to
    macrocephaly, defined as increased head circumference. In 16p11.2 Deletion Syndrome (16pDel),
    macrocephaly is observed in a subset of affected individuals, despite all patients sharing the same
    primary genomic deletion. This evidence supports the genetic heterogeneity of neurodevelopmental
    phenotypes, and suggests that additional genetic variation may influence NPC proliferation and
    contribute to macrocephaly. To investigate the genetic architecture associated with macrocephaly in
    16pDel, we performed a genome-wide analysis of genomic variation in patients stratified by head
    circumference. By directly comparing macrocephalic and normocephalic 16pDel individuals, we aimed to
    identify candidate genes enriched in patients with larger head circumference. This comparative
    approach led to the isolation of genetic factors associated specifically with macrocephaly within
    the context of a shared deletion. Our analysis identified 87 high-confidence genes associated with
    macrocephaly, several of which are established regulators of neurodevelopment. Functional annotation
    revealed enrichment of top candidate genes involved in chromatin remodeling, transcriptional
    regulation, and neuronal development, suggesting biological pathways that may contribute to NPC
    hyperproliferation and differences in head circumference. Through the study of genetic variation
    present in 16pDeletion patients with and without macrocephaly, this study provides insight into
    modifiers of neurodevelopmental growth and highlights biological mechanisms that may contribute to
    NPC hyperproliferation.

