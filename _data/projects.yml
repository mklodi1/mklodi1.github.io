# Projects shown at /projects/, in order.
# Fields: title, objective, skills (comma-separated).
# Optional: link, link_text, figure (/assets/img/...), figure_alt
# Tip: wrap text in "double quotes" if it contains a colon.

- title: "Convergent Rare-Variant Analysis Pipeline for Neurodevelopmental Disorders"
  objective: "Build a customizable pipeline that integrates two complementary statistical genetics tools, pVAAST and Slivar, to identify candidate genes for specific neurodevelopmental phenotypes, such as abnormal head size and language impairment, that are obscured within broad diagnoses."
  skills: "Linux, Python, R, SQL, Gene burden testing, Permutation testing"
  studies:
    - title: "Macrocephaly in 16p11.2 Deletion Syndrome"
      background: "16p11.2 Deletion Syndrome (16pDel) is a recurrent ~600 kb deletion on chromosome 16 associated with neural progenitor cell (NPC) hyperproliferation and brain overgrowth. Despite the shared primary deletion, only a subset of patients exhibit macrocephaly, suggesting that additional modifying genetic variation influences susceptibility to abnormal NPC proliferation."
      objective: "Identify genomic variants that contribute specifically to macrocephaly, using 16pDel as a shared genetic background."
      findings: "Identified 140 candidate genes unique to macrocephaly. These genes converged on the canonical Wnt signaling pathway, which promotes NPC proliferation in the developing cortex, an alternative route to progenitor proliferation distinct from the MAPK/ERK mechanism previously attributed to 16pDel."
    - title: "Abnormal Cranial Growth in Idiopathic ASD"
      background: "Both extremes of head circumference occur at elevated rates in autism spectrum disorder (ASD): roughly 15% of ASD patients exhibit macrocephaly and a similar share exhibit microcephaly, compared with about 3% in the general population. Although clinically opposite, both arise from dysregulated brain growth. Whether the two arise from distinct genetic causes or from shared pathways dysregulated in opposite directions remains unclear."
      objective: "Identify genetic factors associated with macrocephaly and microcephaly, using idiopathic ASD as a shared genetic background."
      findings: "Identified 52 candidate genes for macrocephaly and 50 for microcephaly, including well-established neurodevelopmental genes involved in transcriptional regulation and neurogenesis. The canonical Wnt signaling pathway recurred, supporting the hypothesis that macrocephaly and microcephaly represent opposite poles of a shared genetic axis of cranial growth regulation."
    - title: "Language and Reading Impairment"
      background: "Language impairment frequently co-occurs with ASD, and previous linkage studies of multiplex families identified genomic regions on chromosomes 15 and 16 associated with oral and written language. The genetic architecture underlying this relationship is still unclear."
      objective: "Delineate candidate genes within the linkage regions 15q23–26 (language impairment) and 16p12 (reading impairment), using ASD as a shared genetic background."
      findings: "Refined both linkage regions and prioritized top candidate genes for language and reading impairment, including genes previously implicated in neurodevelopmental disorders and novel candidates, indicating a shared etiology of ASD and language impairment at these two loci."

- title: "Derivatives Pricing and Market Risk Simulation Engine"
  objective: "Build an end-to-end tool that supports daily options trading decisions by identifying underpriced options and estimating the expected profit and tail risk of each trade."
  skills: "Python, Time series analysis (GARCH), Monte Carlo simulation, Black-Scholes, XGBoost"

- title: "AI for Scientific Literature Review"
  objective: "Build an AI agent that assists with manual literature review and improves efficiency through retrieval-augmented generation and semantic search."
  skills: "Python, LLMs, RAG, Embeddings, Vector databases"
