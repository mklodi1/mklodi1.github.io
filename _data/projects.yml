# Projects shown at /projects/. Each group has a heading and a list of projects.
# Fields per project:
#   title, status (short label, e.g. "Published"), summary (one or two sentences)
#   question, approach (list), results (list), tools (comma-separated)
#   Optional: link (url), link_text, figure (/assets/img/...), figure_alt
# Tip: wrap text in "double quotes" if it contains a colon.

- group: "Dissertation Research"
  where: "Rutgers University, Xing Lab"
  projects:
    - title: "Phenotype Definitions in the Genetics of Language and Autism Traits"
      status: "Published, Genes 2026"
      summary: "How the way a trait is defined, narrowly or broadly, changes what a genetic analysis can find, tested on language impairment and other broad autism phenotype traits."
      question: "Does using a narrow or a broad definition of a phenotype change the results of genetic analysis, and does it matter more for some traits than others?"
      approach:
        - "Defined each trait two ways, narrow and broad, in a family-based cohort (NJLAGS)."
        - "Ran family-based genetic analyses under each definition and compared the results."
        - "Compared language with other broad autism phenotype traits to see which were most sensitive to the definition used."
      results:
        - "Phenotype definition affected the genetic analysis of language more than other broad autism phenotype traits."
      tools: "Statistical genetics, Family-based analysis, Phenotype analysis, R, Python"
      link: "https://doi.org/10.3390/genes17020125"
      link_text: "Read the paper"

    - title: "Risk Genes for Macrocephaly in 16p11.2 Deletion Syndrome"
      status: "Manuscript in preparation"
      summary: "Searching for genes outside the 16p11.2 region that help explain why some people with the deletion develop an enlarged head size (macrocephaly) and others do not."
      question: "Which genes, beyond the deletion itself, are associated with macrocephaly in people with 16p11.2 deletion syndrome?"
      approach:
        - "Processed and quality-controlled whole-genome and whole-exome sequencing data from SFARI patient cohorts."
        - "Annotated variants and ran family-based rare variant analysis."
        - "Prioritized candidate genes with my customizable gene prediction framework."
      results:
        - "Identified high-confidence candidate genes, now being followed up with molecular experiments."
        - "Full results will be shared here once published."
      tools: "WGS/WES, Rare variant analysis, Variant calling (GATK), bcftools, Python, SQL, Linux/HPC"

    - title: "Risk Genes for Abnormal Cranial Growth in Idiopathic Autism"
      status: "Manuscript in preparation"
      summary: "Finding candidate genes linked to abnormal head growth in autism without a known genetic cause."
      question: "Which genes are associated with abnormal cranial growth in people with idiopathic autism spectrum disorder?"
      approach:
        - "Combined genomic and clinical data from large SFARI autism cohorts."
        - "Ran rare variant analysis and functional annotation across families."
        - "Ranked candidate genes with my gene prediction framework and worked with experimental teams to choose genes for follow-up."
      results:
        - "Identified high-confidence candidate genes, now being tested experimentally."
        - "Full results will be shared here once published."
      tools: "WGS/WES, Rare variant analysis, Functional annotation, Python, SQL, Linux/HPC"

- group: "Machine Learning Internship"
  where: "EIMplus"
  projects:
    - title: "Derivatives Pricing and Market Risk Simulation Engine"
      status: "Deployed"
      summary: "An end-to-end tool that supports daily options trading decisions by finding underpriced options and estimating the risk of each trade."
      question: "Which options are underpriced today, and what is the expected profit and tail risk of trading them?"
      approach:
        - "Built a pricing module combining Black-Scholes and the Greeks with GARCH volatility forecasts to flag underpriced options."
        - "Ran Monte Carlo simulations from empirical historical return distributions to estimate expected PnL, VaR and CVaR for each trade."
        - "Trained classification models (XGBoost, logistic regression) to filter trading signals."
        - "Published daily volatility forecasts and results in a Streamlit dashboard."
      results:
        - "Deployed tool used to support daily trading decisions."
      tools: "Python, Black-Scholes, Greeks, GARCH, Monte Carlo, VaR/CVaR, XGBoost, Streamlit"

    - title: "AI for Scientific Literature Review"
      status: "Deployed"
      summary: "A retrieval-augmented generation (RAG) system and LLM agent that reviews scientific papers and answers questions with semantic search."
      question: "Can an AI agent take over the slow, manual parts of reviewing scientific literature?"
      approach:
        - "Built a RAG pipeline with embeddings, a vector database (ChromaDB) and semantic similarity search."
        - "Added an LLM agent that searches, reads and summarizes relevant papers."
        - "Deployed with Docker and CI/CD, and tracked experiments with MLflow."
      results:
        - "Cut manual literature review time by 85%."
      tools: "Python, LLMs, RAG, ChromaDB, Embeddings, Docker, CI/CD, MLflow"
