# Couplets for the Poetry card on /personal/. One is shown at random on each page load.
# Urdu text as printed by Rekhta (rekhta.org), Dagh couplet from urdushahkar.org. Only public-domain verse.
# Fields: urdu (two lines, separated by a | ), english, poet
- urdu: "عشق نے غالبؔ نکما کر دیا | ورنہ ہم بھی آدمی تھے کام کے"
  english: "Love has made me useless, Ghalib. Otherwise I too was a man of some worth."
  poet: "Mirza Ghalib"

- urdu: "محبت میں نہیں ہے فرق جینے اور مرنے کا | اسی کو دیکھ کر جیتے ہیں جس کافر پہ دم نکلے"
  english: "In love there's no difference between living and dying: I live by gazing at the very one I'd die for."
  poet: "Mirza Ghalib"

- urdu: "رگوں میں دوڑتے پھرنے کے ہم نہیں قائل | جب آنکھ ہی سے نہ ٹپکا تو پھر لہو کیا ہے"
  english: "I'm not convinced by blood that merely runs through the veins. If it never dripped from the eyes, what is blood worth?"
  poet: "Mirza Ghalib"

- urdu: "ہزاروں خواہشیں ایسی کہ ہر خواہش پہ دم نکلے | بہت نکلے مرے ارمان لیکن پھر بھی کم نکلے"
  english: "A thousand desires, each one worth dying for. Many of my hopes came true, and still they were too few."
  poet: "Mirza Ghalib"

- urdu: "رنج سے خوگر ہوا انساں تو مٹ جاتا ہے رنج | مشکلیں مجھ پر پڑیں اتنی کہ آساں ہو گئیں"
  english: "When a person grows used to sorrow, sorrow disappears. So many hardships fell on me that they became easy."
  poet: "Mirza Ghalib"

- urdu: "ہم وہاں ہیں جہاں سے ہم کو بھی | کچھ ہماری خبر نہیں آتی"
  english: "I've gone to where even news of myself doesn't reach me."
  poet: "Mirza Ghalib"

- urdu: "بنا کر فقیروں کا ہم بھیس غالبؔ | تماشائے اہل کرم دیکھتے ہیں"
  english: "Disguised as a beggar, Ghalib, I watch how the generous really behave."
  poet: "Mirza Ghalib"

- urdu: "تم مرے پاس ہوتے ہو گویا | جب کوئی دوسرا نہیں ہوتا"
  english: "You are with me, as it were, when no one else is there."
  poet: "Momin Khan Momin"

- urdu: "نہ تھی حال کی جب ہمیں خبر رہے دیکھتے اوروں کے عیب و ہنر | پڑی اپنی برائیوں پر جو نظر تو نگاہ میں کوئی برا نہ رہا"
  english: "While I didn't know myself, I kept judging others' faults and virtues. Once I saw my own flaws, no one else seemed bad."
  poet: "Bahadur Shah Zafar"

- urdu: "اُردو ہے جس کا نام ہمیں جانتے ہیں داغؔ | ہندوستاں میں دھوم ہماری زباں کی ہے"
  english: "Only we, Dagh, know the language called Urdu. Our tongue is celebrated across Hindustan."
  poet: "Dagh Dehlvi"
