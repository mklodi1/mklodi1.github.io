# Couplets for the Poetry card on /personal/. One is chosen each day; visitors can browse the rest.
# Only use public-domain verse (classical poets, or works published before 1929) or your own writing.
# Fields: urdu (two lines, separated by a | ), english, poet
- urdu: "ہزاروں خواہشیں ایسی کہ ہر خواہش پہ دم نکلے | بہت نکلے مرے ارمان لیکن پھر بھی کم نکلے"
  english: "A thousand desires, each one worth dying for. Many of my hopes came true, and still they were too few."
  poet: "Mirza Ghalib"

- urdu: "پتا پتا بوٹا بوٹا حال ہمارا جانے ہے | جانے نہ جانے گل ہی نہ جانے باغ تو سارا جانے ہے"
  english: "Every leaf and every plant knows the state I am in. The rose alone may not know, but the whole garden does."
  poet: "Mir Taqi Mir"

- urdu: "دل ناداں تجھے ہوا کیا ہے | آخر اس درد کی دوا کیا ہے"
  english: "Naive heart, what has come over you? What, after all, is the cure for this pain?"
  poet: "Mirza Ghalib"

- urdu: "ابتدائے عشق ہے روتا ہے کیا | آگے آگے دیکھیے ہوتا ہے کیا"
  english: "This is only the beginning of love, so why weep? Just wait and see what lies ahead."
  poet: "Mir Taqi Mir"

- urdu: "ہم کو معلوم ہے جنت کی حقیقت لیکن | دل کے خوش رکھنے کو غالبؔ یہ خیال اچھا ہے"
  english: "I know the truth about paradise, Ghalib, but to keep the heart content, it is a pleasant thought."
  poet: "Mirza Ghalib"

- urdu: "سارے جہاں سے اچھا ہندوستاں ہمارا | ہم بلبلیں ہیں اس کی یہ گلستاں ہمارا"
  english: "Better than all the world is our homeland. We are its nightingales, and it is our garden."
  poet: "Allama Iqbal"

- urdu: "عشق نے غالبؔ نکما کر دیا | ورنہ ہم بھی آدمی تھے کام کے"
  english: "Love has made me useless, Ghalib. Otherwise I too was a man of some worth."
  poet: "Mirza Ghalib"
