---
layout: default
title: Places
permalink: /places/
---
<article class="wrap places">
  <h1>Places</h1>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <div id="places-map" class="places-map" role="img" aria-label="Map of places I've lived: {{ site.data.places | map: 'city' | join: '; ' }}"></div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    (function () {
      var places = {{ site.data.places | jsonify }};
      var box = document.getElementById('places-map');
      if (!window.L) { box.classList.add('map-failed'); box.textContent = 'The map could not load. Try refreshing the page.'; return; }
      if (!places.length) return;

      var map = L.map('places-map', { scrollWheelZoom: false });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
      }).addTo(map);

      var points = places.map(function (p) {
        L.circleMarker([p.lat, p.lng], {
          radius: 7, color: '#ffffff', weight: 2, fillColor: '#1F4E8C', fillOpacity: 1
        }).addTo(map).bindTooltip(p.city, { direction: 'top', offset: [0, -6] });
        return [p.lat, p.lng];
      });

      if (points.length === 1) map.setView(points[0], 8);
      else map.fitBounds(points, { padding: [40, 40] });
    })();
  </script>
  <ul class="places-list">
    {% for p in site.data.places %}<li>{{ p.city }}</li>{% endfor %}
  </ul>
</article>
