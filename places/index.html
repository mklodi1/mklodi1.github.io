---
layout: default
title: Places
permalink: /places/
---
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

<article class="wrap places">
  <h1>Significant Places</h1>
  <p class="muted places-hint">Click a pin or a city to zoom in.</p>

  <div id="places-map" class="places-map" role="region" aria-label="Map of significant places: {{ site.data.places | map: 'city' | join: '; ' }}"></div>
  <div class="places-chips" id="places-chips">
    <button type="button" class="chip" data-index="all">All places</button>
    {% for p in site.data.places %}<button type="button" class="chip" data-index="{{ forloop.index0 }}">{{ p.city }}{% if p.country %} <img class="flag" src="{{ '/assets/img/flags/' | append: p.country | append: '.svg' | relative_url }}" alt="" width="20" height="14">{% endif %}</button>{% endfor %}
  </div>

  {% if site.data.travel %}
  <section class="travel" aria-labelledby="h-travel">
    <h2 id="h-travel">Travel</h2>
    <div id="travel-map" class="places-map" role="region" aria-label="Map of places I've traveled: {{ site.data.travel | map: 'city' | join: '; ' }}"></div>
    <div class="places-chips" id="travel-chips">
      <button type="button" class="chip" data-index="all">All places</button>
      {% for p in site.data.travel %}<button type="button" class="chip" data-index="{{ forloop.index0 }}">{{ p.city }}{% if p.country %} <img class="flag" src="{{ '/assets/img/flags/' | append: p.country | append: '.svg' | relative_url }}" alt="" width="20" height="14">{% endif %}</button>{% endfor %}
    </div>
  </section>
  {% endif %}
</article>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
  (function () {
    var flagBase = {{ '/assets/img/flags/' | relative_url | jsonify }};
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var colors = ['#FF6B6B', '#FFB020', '#2EC4B6', '#5B8DEF', '#B36BFF', '#FF7EB6', '#3DDC84'];

    function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    function pinIcon(color, delay) {
      var svg =
        '<svg viewBox="0 0 40 52" width="40" height="52" aria-hidden="true">' +
          '<ellipse class="pin-shadow" cx="20" cy="49" rx="9" ry="3"></ellipse>' +
          '<path class="pin-body" d="M20 2C10.6 2 3 9.4 3 18.6 3 31 20 47 20 47s17-16 17-28.4C37 9.4 29.4 2 20 2z" fill="' + color + '"></path>' +
          '<circle class="pin-dot" cx="20" cy="18.5" r="6.5"></circle>' +
        '</svg>';
      return L.divIcon({
        className: 'pin-icon',
        html: '<div class="pin" style="animation-delay:' + delay + 'ms">' + svg + '</div>',
        iconSize: [40, 52],
        iconAnchor: [20, 48],
        popupAnchor: [0, -44]
      });
    }

    // Builds one cartoon map with pins and clickable city buttons.
    function buildMap(mapId, chipsId, places) {
      var box = document.getElementById(mapId);
      if (!box) return;
      if (!window.L) { box.classList.add('map-failed'); box.textContent = 'The map could not load. Try refreshing the page.'; return; }
      if (!places || !places.length) return;

      var map = L.map(mapId, { scrollWheelZoom: false, zoomSnap: 0.5 });
      // Esri World Street Map: keyless, English place names. Falls back to OpenStreetMap if it fails.
      var osmCredit = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
      var tiles = L.tileLayer('https://{s}.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18,
        subdomains: ['server', 'services'],
        attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>, HERE, Garmin, USGS, NOAA'
      }).addTo(map);
      var tileErrors = 0;
      tiles.on('tileerror', function () {
        tileErrors++;
        if (tileErrors === 4) {
          map.removeLayer(tiles);
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: osmCredit }).addTo(map);
        }
      });

      var chips = document.querySelectorAll('#' + chipsId + ' .chip');
      function setActive(key) {
        for (var c = 0; c < chips.length; c++) {
          chips[c].setAttribute('aria-pressed', chips[c].getAttribute('data-index') === key ? 'true' : 'false');
        }
      }

      var markers = [];
      function flyTo(i) {
        var p = places[i];
        map.closePopup();
        map.flyTo([p.lat, p.lng], 10, { duration: reduceMotion ? 0 : 1.4 });
        map.once('moveend', function () { markers[i].openPopup(); });
        setActive(String(i));
      }

      var step = Math.min(160, Math.round(2000 / places.length));
      places.forEach(function (p, i) {
        var m = L.marker([p.lat, p.lng], {
          icon: pinIcon(colors[i % colors.length], reduceMotion ? 0 : 250 + i * step),
          title: p.city,
          riseOnHover: true
        }).addTo(map);
        var flag = p.country ? '<img class="flag flag-lg" src="' + flagBase + esc(p.country) + '.svg" alt="" width="36" height="24">' : '';
        var popup = '<strong>' + esc(p.city) + '</strong>' + (p.note ? '<br><span class="pin-note">' + esc(p.note) + '</span>' : '') + flag;
        m.bindPopup(popup, { closeButton: false, className: 'pin-popup', maxWidth: 240 });
        m.on('click', function () { flyTo(i); });
        markers.push(m);
      });

      var allBounds = L.latLngBounds(places.map(function (p) { return [p.lat, p.lng]; }));
      function showAll(animate) {
        map.closePopup();
        if (places.length === 1) map.setView([places[0].lat, places[0].lng], 8);
        else if (animate && !reduceMotion) map.flyToBounds(allBounds, { padding: [50, 50], duration: 1.2 });
        else map.fitBounds(allBounds, { padding: [50, 50] });
        setActive('all');
      }

      for (var c = 0; c < chips.length; c++) {
        chips[c].addEventListener('click', function () {
          var key = this.getAttribute('data-index');
          if (key === 'all') showAll(true); else flyTo(Number(key));
        });
      }

      showAll(false);
    }

    buildMap('places-map', 'places-chips', {{ site.data.places | jsonify }});
    buildMap('travel-map', 'travel-chips', {{ site.data.travel | jsonify }});
  })();
</script>
